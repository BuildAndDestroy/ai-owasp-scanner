# Apply before dashboard-mongodb.yaml. Replace placeholders before production use.
# kubectl apply -f k8s/mongodb-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  labels:
    app.kubernetes.io/name: mongodb
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: owasp
  MONGO_INITDB_ROOT_PASSWORD: changeme-replace-in-production
  MONGODB_URI: mongodb://owasp:changeme-replace-in-production@mongodb:27017/?authSource=admin
